<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Kamar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 id="nama-kamar">Memuat Kamar...</h1>
        <p id="slogan-kamar"></p>
    </header>

    <nav>
        <a href="#profil">Profil & Leadroom</a>
        <a href="#penghuni">Anak Kamar Bulan Ini</a>
        <a href="#arsip">Arsip & Rangkuman</a>
    </nav>

    <main>
        <!-- Section Profil & Leadroom -->
        <section id="profil">
            <h2>Tentang Kamar</h2>
            <p id="desc-kamar"></p>
            
            <h3>Penjaga Kamar (Leadroom)</h3>
            <div id="leadroom-card" class="card"></div>
        </section>

        <!-- Section Penghuni Bulan Ini -->
        <section id="penghuni">
            <h2>Penghuni Kamar Bulan Ini</h2>
            <div id="grid-penghuni" class="grid-container"></div>
        </section>

        <!-- Section Arsip -->
        <section id="arsip">
            <h2>Arsip Kamar</h2>
            
            <div class="archive-box">
                <h3>Rangkuman Bulanan</h3>
                <div id="list-rangkuman"></div>
            </div>

            <div class="archive-box" style="margin-top: 20px;">
                <h3>Arsip Foto & Nama Anak Berdasarkan Bulan</h3>
                <select id="select-bulan" onchange="filterArsipAnak()">
                    <option value="">Pilih Bulan...</option>
                </select>
                <div id="grid-arsip-anak" class="grid-container"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Dormitory Profile. Hosted on GitHub Pages.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
