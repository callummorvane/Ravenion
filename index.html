<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Kamar - Ravenclaw</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 id="nama-kamar">Memuat Kamar...</h1>
        <p id="slogan-kamar"></p>
    </header>

    <!-- Navigasi Per Halaman -->
    <nav>
        <button class="nav-btn active" onclick="switchPage('profil')">Profil & Leadroom</button>
        <button class="nav-btn" onclick="switchPage('penghuni')">Anak Kamar Bulan Ini</button>
        <button class="nav-btn" onclick="switchPage('arsip')">Arsip & Rangkuman</button>
    </nav>

    <main>
        <!-- Halaman 1: Profil & Leadroom -->
        <section id="page-profil" class="page-content active-page">
            <h2>Tentang Kamar</h2>
            <p id="desc-kamar"></p>
            
            <h3>Penjaga Kamar (Leadroom)</h3>
            <div id="leadroom-card" class="card"></div>
        </section>

        <!-- Halaman 2: Penghuni Bulan Ini -->
        <section id="page-penghuni" class="page-content">
            <h2>Penghuni Kamar Bulan Ini</h2>
            <div id="grid-penghuni" class="grid-container"></div>
        </section>

        <!-- Halaman 3: Arsip & Rangkuman -->
        <section id="page-arsip" class="page-content">
            <h2>Arsip Kamar</h2>
            
            <div class="archive-box">
                <h3>Rangkuman Bulanan</h3>
                <div id="list-rangkuman"></div>
            </div>

            <div class="archive-box" style="margin-top: 25px;">
                <h3>Arsip Foto & Nama Anak Berdasarkan Bulan</h3>
                <select id="select-bulan" onchange="filterArsipAnak()">
                    <option value="">Pilih Bulan...</option>
                </select>
                <div id="grid-arsip-anak" class="grid-container"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Ravenclaw Dormitory. Hosted on GitHub Pages.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
